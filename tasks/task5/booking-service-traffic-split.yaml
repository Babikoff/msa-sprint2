# VirtualService и DestinationRule используются для определения маршрутизации трафика 
# и правил балансировки нагрузки.

apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: booking
spec:
  hosts:
  - booking
  http:
  - route:
    # TODO: match by x-feature-enabled
    - destination:
        host: booking
        subset: v1
      weight: 90 # TODO: 100
    - destination:
        host: booking
        subset: v2
      weight: 10  # TODO: 0

# TODO: Как расширить DestinationRule пока не понятно
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: booking
spec:
  host: booking
  subsets:
  - name: v1
    labels:
      version: v1
    #TODO: add a subset for v2
    #TODO add trafficPolicy with connectionPool for each subset
  #TODO: add trafficPolicy with connectionPool and outlierDetection

