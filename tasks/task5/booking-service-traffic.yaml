# VirtualService и DestinationRule используются для определения маршрутизации трафика 
# и правил балансировки нагрузки.

apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: booking
spec:
  hosts:
  - booking
  http:
  - route:
    - destination:
        host: booking
        subset: v1

apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: booking
spec:
  host: booking
  subsets:
  - name: v1
    labels:
      version: v1
