# VirtualService и DestinationRule определяют маршрутизацию трафика
# (канареечный release, фича-флаг, retries) и правила Circuit Breaking.

apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: booking-service
spec:
  host: booking-service
  # Circuit Breaking: защищает сервис от перегрузки и подов с ошибками.
  trafficPolicy: # Дефолтные параметры для всех версий
    connectionPool: # ограничения нагрузки на сервис для каждого pod-а
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 10
    outlierDetection: # параметры контроля работы pod-ов
      consecutive5xxErrors: 3   # три пятисотых ошибки и ставим pod на паузу
      interval: 10s             # периодичность проверки pod-а
      baseEjectionTime: 30s     # Первый период исключения pod-а из обслуживания
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy: # Переопределяем дефолтные параметры трафика для v1
      connectionPool:
        tcp:
          maxConnections: 150
        http:
          http1MaxPendingRequests: 20
          maxRequestsPerConnection: 15
  - name: v2
    labels:
      version: v2
    trafficPolicy: # Переопределяем дефолтные параметры трафика для v2
      connectionPool: 
        tcp:
          maxConnections: 150
        http:
          http1MaxPendingRequests: 20
          maxRequestsPerConnection: 15

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: booking-service
spec:
  hosts:
  - booking-service
  http:
  # Если клиент шлёт X-Feature-Enabled: true, то
  # трафик идёт на новую версию v2 (100%).
  - name: booking-feature-flag
    match:
    - headers:
        x-feature-enabled:
          exact: "true"
    route:
    - destination:
        host: booking-service
        subset: v2
      weight: 100

  # ИНАЧЕ -> канареечный Release с распределением трафика: 90% -> v1, 10% -> v2.
  # Retries на стороне Envoy защищают от сбоев и задержек.
  - name: booking-service-canary
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,refused-stream,reset
    route:
    - destination:
        host: booking-service
        subset: v1
      weight: 90
    - destination:
        host: booking-service
        subset: v2
      weight: 10
